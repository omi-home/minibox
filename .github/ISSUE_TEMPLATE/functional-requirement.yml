name: "Functional Requirement"
description: "Hệ thống phải <hành vi> | <vai trò> có thể <hành động>"
type: "Functional Requirement"
title: "[Functional Requirement] Hệ thống phải "
body:
  - type: textarea
    id: s1
    attributes:
      label: "Mô tả"
      description: "Đầu vào → xử lý → đầu ra"
    validations:
      required: true
  - type: textarea
    id: s2
    attributes:
      label: "Story"
      description: "Là <vai trò>, tôi muốn <hành động> để <giá trị> (khi yêu cầu xuất phát từ một vai trò)"
    validations:
      required: false
  - type: textarea
    id: s3
    attributes:
      label: "Acceptance criteria"
      description: "Mỗi dòng kiểm chứng được bằng test; không tự động được thì ghi [manual]"
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: s4
    attributes:
      label: "Ràng buộc"
    validations:
      required: false
  - type: textarea
    id: s5
    attributes:
      label: "Tham chiếu"
      description: "Mỗi dòng một docs/<file>.md#<mục>; context ghép đúng mục đó, không chép tài liệu vào đây"
    validations:
      required: false
