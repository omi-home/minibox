# Build + toàn bộ test (backend, frontend, script, hợp đồng) và e2e smoke trên mọi PR (spec §9.3, NFR #217: ≤ 15 phút).
# Action ghim theo commit SHA (tag ghi đè được), dependabot (.github/dependabot.yml) đề xuất nâng (217.1).
name: ci
on:
  pull_request:
  push:
    branches: [develop, main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    # ubuntu-latest có sẵn Docker cho Testcontainers (PostgreSQL/RabbitMQ) và docker compose.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: src/backend/global.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/backend/**/*.csproj', 'src/backend/**/*.props', 'src/backend/**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.23.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      # Trình duyệt Playwright theo phiên bản trong lockfile (217.2); thư viện hệ thống vẫn cài bằng --with-deps.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/frontend/pnpm-lock.yaml') }}
      - run: node scripts/test.mjs
      - run: node scripts/e2e.mjs
      # Ảnh chụp /design 4 breakpoint (bằng chứng nghiệm thu #231) và trace khi lỗi.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-results
          path: src/frontend/test-results/
          if-no-files-found: ignore
  images:
    # Build image app như lúc deploy (src/backend/Dockerfile, src/frontend/Dockerfile) và kiểm nội dung (#424, 220.1),
    # rồi smoke e2e trên stack Compose dựng từ chính các image đó (cache build dùng lại): health mọi service, đăng nhập admin (#219).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.23.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/frontend/pnpm-lock.yaml') }}
      - run: node --test scripts/images.docker-test.mjs
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
        working-directory: src/frontend
      - run: node scripts/smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: smoke-results
          path: src/frontend/test-results/
          if-no-files-found: ignore
