# Môi trường staging trên homeserver (spec §8.2, §8.4): Compose project riêng, không publish cổng — chỉ Caddy chung (deploy/caddy/) ra ngoài.
# Secret: /srv/minibox/staging/secrets/ (root, quyền 600), mount dạng Docker secret; repo không chứa giá trị. Danh sách file: deploy/staging/.env.example.
name: minibox-staging

services:
  database-postgres:
    container_name: minibox-staging-database-postgres
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin
    secrets: [postgres_admin]

  infra-rabbitmq:
    container_name: minibox-staging-infra-rabbitmq
    secrets:
      - source: rabbitmq_conf # default_user/default_pass dạng rabbitmq.conf (image RabbitMQ 4 không đọc *_PASS_FILE)
        target: /etc/rabbitmq/conf.d/90-secret.conf

  infra-seaweedfs:
    container_name: minibox-staging-infra-seaweedfs
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/run/secrets/seaweedfs_s3"]
    secrets: [seaweedfs_s3]

  infra-clamav:
    container_name: minibox-staging-infra-clamav

  infra-mailpit:
    container_name: minibox-staging-infra-mailpit

networks:
  # Do Caddy chung (deploy/caddy/) tạo; chỉ frontend (BFF) được nối vào để backend, /health/*, /.well-known/* không lộ ra ngoài.
  edge:
    name: minibox-staging-edge
    external: true

secrets:
  postgres_admin:
    file: /srv/minibox/staging/secrets/postgres_admin.password
  rabbitmq_conf:
    file: /srv/minibox/staging/secrets/rabbitmq.conf
  seaweedfs_s3:
    file: /srv/minibox/staging/secrets/seaweedfs_s3.json
