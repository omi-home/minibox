# Môi trường production trên homeserver (spec §8.2, §8.4): Compose project riêng, không publish cổng — chỉ Caddy chung (deploy/caddy/) ra ngoài.
# Secret: /srv/minibox/production/secrets/ (root, quyền 600), mount dạng Docker secret; repo không chứa giá trị. Danh sách file: deploy/production/.env.example.
name: minibox-production

services:
  database-postgres:
    container_name: minibox-production-database-postgres
    # Image kèm pgBackRest + WAL archive (deploy/backup/, spec §8.6); lịch backup: deploy/backup/pgbackrest.cron.
    image: minibox/postgres-pgbackrest:18
    build:
      context: backup # tính từ deploy/ (file compose đầu tiên)
      dockerfile: postgres.Dockerfile
    volumes:
      - pgbackrest-repo:/var/lib/pgbackrest
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin
    secrets: [postgres_admin]

  infra-rabbitmq:
    container_name: minibox-production-infra-rabbitmq
    secrets:
      - source: rabbitmq_conf # default_user/default_pass dạng rabbitmq.conf (image RabbitMQ 4 không đọc *_PASS_FILE)
        target: /etc/rabbitmq/conf.d/90-secret.conf

  infra-seaweedfs:
    container_name: minibox-production-infra-seaweedfs
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/run/secrets/seaweedfs_s3"]
    secrets: [seaweedfs_s3]

  infra-clamav:
    container_name: minibox-production-infra-clamav

  infra-mailpit:
    container_name: minibox-production-infra-mailpit

  # Ứng dụng (deploy/apps.yaml): backend chỉ ở mạng nội bộ + otel; frontend (BFF) thêm mạng edge để Caddy route.
  backend-identity:
    extends: { file: apps.yaml, service: backend-identity }
    container_name: minibox-production-backend-identity
    networks: [default, otel]
    secrets:
      - { source: identity_app_connection, target: ConnectionStrings__App }
      - { source: backend_rabbitmq_uri, target: ConnectionStrings__RabbitMq }
      - { source: identity_mfa_key, target: Mfa__EncryptionKey }

  backend-localization:
    extends: { file: apps.yaml, service: backend-localization }
    container_name: minibox-production-backend-localization
    networks: [default, otel]
    secrets:
      - { source: localization_app_connection, target: ConnectionStrings__App }
      - { source: backend_rabbitmq_uri, target: ConnectionStrings__RabbitMq }

  backend-catalog:
    extends: { file: apps.yaml, service: backend-catalog }
    container_name: minibox-production-backend-catalog
    networks: [default, otel]
    secrets:
      - { source: catalog_app_connection, target: ConnectionStrings__App }
      - { source: backend_rabbitmq_uri, target: ConnectionStrings__RabbitMq }

  frontend-admin:
    extends: { file: apps.yaml, service: frontend-admin }
    container_name: minibox-production-frontend-admin
    networks: [default, edge, otel]
    secrets:
      - { source: admin_session_key, target: ADMIN_SESSION_KEY }
      - { source: frontend_rabbitmq_url, target: RABBITMQ_URL }

  frontend-shop:
    extends: { file: apps.yaml, service: frontend-shop }
    container_name: minibox-production-frontend-shop
    networks: [default, edge, otel]
    secrets:
      - { source: frontend_rabbitmq_url, target: RABBITMQ_URL }

volumes:
  pgbackrest-repo:

networks:
  # Do Caddy chung (deploy/caddy/) tạo; chỉ frontend (BFF) được nối vào để backend, /health/*, /.well-known/* không lộ ra ngoài.
  edge:
    name: minibox-production-edge
    external: true
  # Do bộ observability chung (deploy/observability/) tạo; backend nối vào để gửi OTLP tới observability-otel-collector:4317.
  otel:
    name: minibox-production-otel
    external: true

secrets:
  postgres_admin:
    file: /srv/minibox/production/secrets/postgres_admin.password
  rabbitmq_conf:
    file: /srv/minibox/production/secrets/rabbitmq.conf
  seaweedfs_s3:
    file: /srv/minibox/production/secrets/seaweedfs_s3.json
  # Sinh bởi scripts/deploy.mjs (appSecrets) từ mật khẩu bootstrap + rabbitmq.conf; chủ là uid của user trong image, quyền 400.
  identity_app_connection:
    file: /srv/minibox/production/secrets/identity_app.connection
  localization_app_connection:
    file: /srv/minibox/production/secrets/localization_app.connection
  catalog_app_connection:
    file: /srv/minibox/production/secrets/catalog_app.connection
  backend_rabbitmq_uri:
    file: /srv/minibox/production/secrets/backend_rabbitmq.uri
  frontend_rabbitmq_url:
    file: /srv/minibox/production/secrets/frontend_rabbitmq.url
  identity_mfa_key:
    file: /srv/minibox/production/secrets/identity_mfa.key
  admin_session_key:
    file: /srv/minibox/production/secrets/admin_session.key
