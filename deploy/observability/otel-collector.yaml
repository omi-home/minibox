# OTel Collector chung (spec §8.5). Log: đọc file json-file của Docker; trace/metric: OTLP từ service.
extensions:
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  filelog:
    include: [/var/lib/docker/containers/*/*-json.log]
    start_at: end
    storage: file_storage
    operators:
      # Dòng json-file: {"log":"<stdout>\n","stream":"stdout","attrs":{nhãn Compose},"time":"..."} (log-opt labels ở deploy/compose.yaml).
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout_type: gotime
          layout: "2006-01-02T15:04:05.999999999Z07:00"
      # Chỉ container của môi trường minibox-<env> (bỏ chính bộ observability và container khác trên máy).
      - type: filter
        expr: 'attributes.attrs == nil || attributes.attrs["com.docker.compose.project"] == nil || !(attributes.attrs["com.docker.compose.project"] matches "^minibox-(staging|production)$")'
      # Container minibox-<env>-<layer>-<tên> → deployment.environment=<env>, service.name=<tên> (trùng service.name của trace).
      - type: regex_parser
        parse_from: attributes.attrs["com.docker.compose.project"]
        regex: "^minibox-(?P<env>[a-z]+)$"
        parse_to: resource
      - type: move
        from: resource.env
        to: resource["deployment.environment"]
      - type: regex_parser
        parse_from: attributes.attrs["com.docker.compose.service"]
        regex: "^(?P<layer>[a-z]+)-(?P<name>[a-z0-9-]+)$"
        parse_to: resource
      - type: move
        from: resource.name
        to: resource["service.name"]
      - type: move
        from: resource.layer
        to: resource["service.namespace"]
      - type: remove
        field: attributes.attrs
      - type: remove
        field: attributes.time
      - type: move
        from: attributes.log
        to: body
      # Log JSON của service (MiniboxJsonFormatter): ts, level, category, message, trace_id, span_id, fields, exception.
      - type: json_parser
        if: 'body matches "^\\s*\\{"'
        parse_from: body
        parse_to: attributes
        severity:
          parse_from: attributes.level
          mapping:
            info: Information
            warn: Warning
            fatal: Critical
      - type: trace_parser
        if: "attributes.trace_id != nil"
        trace_id:
          parse_from: attributes.trace_id
        span_id:
          parse_from: attributes.span_id
      - type: remove
        if: "attributes.trace_id != nil"
        field: attributes.trace_id
      - type: remove
        if: "attributes.span_id != nil"
        field: attributes.span_id
      - type: move
        if: "attributes.message != nil"
        from: attributes.message
        to: body

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}

exporters:
  otlphttp/loki:
    endpoint: http://observability-loki:3100/otlp
  otlp/tempo:
    endpoint: observability-tempo:4317
    tls:
      insecure: true # mạng Compose nội bộ minibox-observability
  otlphttp/prometheus:
    endpoint: http://observability-prometheus:9090/api/v1/otlp

service:
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [filelog]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
