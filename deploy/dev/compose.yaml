# Môi trường dev (máy lập trình viên): `node scripts/dev.mjs`. Cổng chỉ mở trên 127.0.0.1.
name: minibox-dev

services:
  database-postgres:
    container_name: minibox-dev-database-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minibox} # chỉ dev; staging/production dùng Docker secret
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]

  infra-rabbitmq:
    container_name: minibox-dev-infra-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-minibox}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-minibox}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672" # giao diện quản trị

  infra-seaweedfs:
    container_name: minibox-dev-infra-seaweedfs
    ports: ["127.0.0.1:${SEAWEEDFS_S3_PORT:-8333}:8333"]
    # Tạo bucket qua filer nội bộ ngay sau khi container chạy, chờ filer tối đa 60 giây (201 mới tạo, 409 đã có).
    # Service mới cần bucket thì thêm tên vào danh sách.
    post_start:
      - command:
          - sh
          - -c
          - |
            for b in catalog-files catalog-preview catalog-evidence; do
              for i in $$(seq 60); do
                code=$$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:8888/buckets/$$b/")
                case $$code in 201|409) echo "bucket $$b: $$code"; continue 2 ;; esac
                sleep 1
              done
              echo "bucket $$b: lỗi HTTP $$code" >&2; exit 1
            done

  infra-clamav:
    container_name: minibox-dev-infra-clamav
    ports: ["127.0.0.1:${CLAMAV_PORT:-3310}:3310"]

  infra-mailpit:
    container_name: minibox-dev-infra-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025" # hộp thư web
