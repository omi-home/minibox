# pgBackRest trong container database-postgres (spec §8.6). repo1 = volume pgbackrest-repo (đĩa cục bộ; chuyển sang đĩa khác khi chốt OPEN-02).
# repo2 ngoài nhà qua S3 thêm khi chốt OPEN-03 — bắt buộc mã hóa (backup chứa hash mật khẩu, khóa MFA, audit_log):
#   repo2-type=s3  repo2-s3-endpoint=…  repo2-s3-bucket=…  repo2-s3-region=…  repo2-path=/minibox  repo2-retention-full-type=time  repo2-retention-full=14
#   repo2-cipher-type=aes-256-cbc
#   repo2-cipher-pass, repo2-s3-key, repo2-s3-key-secret: KHÔNG ghi ở đây — đưa qua env PGBACKREST_REPO2_CIPHER_PASS/… đọc từ Docker secret.
[global]
repo1-path=/var/lib/pgbackrest
# Giữ full đủ để PITR về 14 ngày trước; full hằng tuần → luôn còn ít nhất 2 bản full.
repo1-retention-full-type=time
repo1-retention-full=14
compress-type=zst
start-fast=y
log-level-console=info
log-level-file=off

[minibox]
pg1-path=/var/lib/postgresql/18/docker
pg1-user=db_admin
